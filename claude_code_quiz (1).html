<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>클로드 코드 퀴즈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;background:#f5f5f0;color:#111;min-height:100vh;}
#app{max-width:700px;margin:0 auto;padding:1.5rem 1rem 3rem;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:8px;}
.title{font-size:20px;font-weight:600;color:#111;}
.progress{font-size:13px;color:#666;}
.qcard{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.qtag{font-size:11px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;}
.qtext{font-size:15px;font-weight:600;color:#111;line-height:1.7;margin-bottom:1rem;white-space:pre-line;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid #e0e0d8;border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s;font-size:14px;color:#222;background:#fafaf8;user-select:none;}
.opt:hover{background:#f0f0e8;border-color:#bbb;}
.opt.selected{border-color:#2563eb;background:#eff6ff;color:#1e3a8a;}
.opt.correct{border-color:#16a34a;background:#f0fdf4;color:#14532d;}
.opt.wrong{border-color:#dc2626;background:#fef2f2;color:#7f1d1d;}
.opt-label{font-weight:600;min-width:22px;flex-shrink:0;}
.multi-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid #e0e0d8;border-radius:8px;cursor:pointer;font-size:14px;color:#222;background:#fafaf8;user-select:none;transition:background .15s;}
.multi-opt:hover{background:#f0f0e8;border-color:#bbb;}
.multi-opt.selected{border-color:#2563eb;background:#eff6ff;color:#1e3a8a;}
.multi-opt.correct{border-color:#16a34a;background:#f0fdf4;color:#14532d;}
.multi-opt.wrong{border-color:#dc2626;background:#fef2f2;color:#7f1d1d;}
.fill-wrap{display:flex;flex-direction:column;gap:10px;}
.fill-label{font-size:13px;color:#666;margin-bottom:3px;}
.fill-input{width:100%;padding:8px 10px;border:1px solid #d0d0c8;border-radius:7px;font-size:14px;color:#111;background:#fafaf8;}
.fill-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe;}
.fill-input.correct{border-color:#16a34a;background:#f0fdf4;}
.fill-input.wrong{border-color:#dc2626;background:#fef2f2;}
.fill-input[readonly]{background:#f5f5f0;cursor:default;}
.btns{display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap;align-items:center;}
.btn-submit{padding:9px 20px;border-radius:8px;background:#16a34a;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-submit:hover{background:#15803d;}
.btn-next{padding:9px 20px;border-radius:8px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-next:hover{background:#1d4ed8;}
.btn-secondary{padding:9px 18px;border-radius:8px;background:#fff;color:#444;border:1px solid #d0d0c8;font-size:14px;cursor:pointer;transition:background .15s;}
.btn-secondary:hover{background:#f0f0e8;}
.feedback{margin-top:10px;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6;}
.feedback.correct{background:#f0fdf4;color:#14532d;border:1px solid #86efac;}
.feedback.wrong{background:#fef2f2;color:#7f1d1d;border:1px solid #fca5a5;}
.feedback.partial{background:#fffbeb;color:#78350f;border:1px solid #fde68a;}
.nav-dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem;}
.dot{width:10px;height:10px;border-radius:50%;background:#d0d0c8;cursor:pointer;transition:background .15s;flex-shrink:0;}
.dot:hover{background:#aaa;}
.dot.answered{background:#16a34a;}
.dot.current{background:#2563eb;}
.dot.wrong-dot{background:#dc2626;}
.score-box{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:2.5rem 2rem;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.score-num{font-size:52px;font-weight:700;color:#16a34a;}
.score-sub{font-size:15px;color:#666;margin-top:6px;}
.score-grade{font-size:24px;margin-top:8px;}
.review-list{margin-top:1.2rem;}
.review-item{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid #eee;font-size:13px;cursor:pointer;}
.review-item:hover{background:#fafaf8;}
.review-icon{font-size:16px;min-width:20px;}
.review-section{color:#888;min-width:80px;font-size:12px;}
.review-q{color:#333;flex:1;}
.multi-hint{font-size:12px;color:#888;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"><div id="root"></div></div>
<script>
const ALL_QUESTIONS = [
  {id:'1',section:'AI 발전 / 바이브 코딩',type:'radio',q:'다음 중 AI의 발전 과정을 올바른 순서로 나열한 것은?',opts:['뉴럴 네트워크 → 딥러닝 → 트랜스포머 → LLM','딥러닝 → 뉴럴 네트워크 → LLM → 트랜스포머','트랜스포머 → 뉴럴 네트워크 → 딥러닝 → LLM','LLM → 트랜스포머 → 딥러닝 → 뉴럴 네트워크'],ans:0,explain:'뉴럴 네트워크(초기) → 딥러닝(심층 신경망) → 트랜스포머(어텐션 기반) → LLM(대형 언어 모델)'},
  {id:'2',section:'AI 발전 / 바이브 코딩',type:'fill',q:'바이브 코딩 도구는 여러 AI를 선택할 수 있는 [A] 도구와 자체 AI를 활용하는 [B] 도구로 나뉜다.',fills:[{id:'A',label:'[A] 첫 번째 도구 종류',ans:['멀티-AI','멀티 AI','멀티AI']},{id:'B',label:'[B] 두 번째 도구 종류',ans:['내장 AI','내장AI','자체 AI']}],explain:'멀티-AI 도구 vs 내장(자체) AI 도구'},
  {id:'3',section:'AI 발전 / 바이브 코딩',type:'radio',q:'다음 중 AI 어시스턴트의 발전 과정을 올바른 순서로 나열한 것은?',opts:['규칙 기반 → 통계 기반 → 딥러닝 기반 → LLM 기반','통계 기반 → 규칙 기반 → LLM 기반 → 딥러닝 기반','딥러닝 기반 → LLM 기반 → 규칙 기반 → 통계 기반','LLM 기반 → 딥러닝 기반 → 통계 기반 → 규칙 기반'],ans:0,explain:'규칙 기반 → 통계 기반 → 딥러닝 기반 → LLM 기반 순서로 발전했다.'},
  {id:'4',section:'AI 발전 / 바이브 코딩',type:'radio',q:'다음 중 CLI 기반 바이브 코딩 도구의 특징으로 옳지 않은 것은?',opts:['터미널에서 실행한다','GUI 없이 텍스트로만 소통한다','여러 AI 모델을 자유롭게 선택할 수 있다','프로젝트 파일을 직접 수정할 수 있다'],ans:2,explain:'CLI 기반 도구는 보통 특정 모델만 사용하며, 여러 AI 모델을 자유롭게 선택하는 것은 멀티-AI 도구의 특징이다.'},
  {id:'5',section:'프롬프트 / PRD / 4단계 전략',type:'radio',q:'다음 중 좋은 프롬프트의 조건이 아닌 것을 고르세요.',opts:['명확성: 원하는 결과를 구체적으로 전달한다.','구체성: 필요한 기능이나 조건을 세부적으로 지시한다.','창의성: 결과물이 놀라움을 주도록 요구한다.','맥락 제공: 왜 필요한지, 어떤 상황에서 활용되는지 알려 준다.'],ans:2,explain:'좋은 프롬프트의 조건은 명확성, 구체성, 맥락 제공 등이며, 결과물에 놀라움을 주도록 요구하는 것은 일반적인 조건이 아니다.'},
  {id:'6',section:'프롬프트 / PRD / 4단계 전략',type:'fill',q:'프롬프트와 PRD는 모두 [A] 원칙을 기반으로 한다.\n이 원칙은 Why, Who, What, When, Where, How 여섯 가지 질문으로 구성된다.',fills:[{id:'A',label:'[A] 원칙 이름',ans:['5W1H','5W 1H']}],explain:'5W1H: Why, Who, What, When, Where, How'},
  {id:'7',section:'프롬프트 / PRD / 4단계 전략',type:'radio',q:'4단계 전략의 올바른 순서는?',opts:['디자인 → 기본 틀 → 기능 → 점검','기본 틀 → 디자인 → 기능 → 점검','기본 틀 → 기능 → 디자인 → 점검','기능 → 기본 틀 → 점검 → 디자인'],ans:1,explain:'기본 틀 → 디자인 → 기능 → 점검 순서로 진행한다.'},
  {id:'8',section:'프롬프트 / PRD / 4단계 전략',type:'radio',q:'효과적인 프롬프트 작성법으로 옳지 않은 것은?',opts:['5W1H 템플릿을 활용하여 체계적으로 질문한다.','모든 기능을 한 번에 요청하여 시간을 절약한다.','각 섹션에 ID를 부여하여 개별 수정이 가능하도록 한다.','구체적인 디자인 레퍼런스를 제공한다.'],ans:1,explain:'모든 기능을 한 번에 요청하면 오히려 비효율적이다. 단계별로 나눠 요청하는 것이 좋다.'},
  {id:'9',section:'환경설치 / 터미널 / npm',type:'radio',q:'클로드 코드를 실행하기 위해 필수적으로 설치해야 하는 두 가지 프로그램을 고르세요.',opts:['Python과 Visual Studio Code','Node.js와 Git','Docker와 Kubernetes','Chrome과 Firefox'],ans:1,explain:'Claude Code는 Node.js 환경에서 npm으로 설치하며, 버전 관리를 위해 Git이 필요하다.'},
  {id:'10',section:'환경설치 / 터미널 / npm',type:'radio',q:'윈도우 운영체제에서 터미널을 실행하는 명령어는 무엇일까요?',opts:['terminal','explorer','cmd','console'],ans:2,explain:'윈도우에서는 실행창(Win+R)이나 탐색기 주소창에 cmd를 입력하여 터미널을 실행한다.'},
  {id:'11',section:'환경설치 / 터미널 / npm',type:'radio',q:'npm install -g @anthropic-ai/claude-code 에서 -g 옵션의 의미는?',opts:['Git과 연동하여 설치','그래픽 모드로 설치','시스템 전체에서 사용 가능하도록 설치 (global)','게스트 모드로 설치'],ans:2,explain:'-g 는 global의 약자로, 시스템 전체에서 사용 가능하도록 전역 설치한다.'},
  {id:'12',section:'환경설치 / 터미널 / npm',type:'fill',q:'클로드 코드 초기 설정 명령어를 채워 보세요.\n• 프로젝트 구조를 분석하고 CLAUDE.md 파일을 자동 생성 → [A]\n• 현재 세션의 토큰 사용량과 남은 컨텍스트 용량 확인 → [B]\n• 사용할 AI 모델을 선택하거나 Default 옵션으로 변경 → [C]\n• 사용 가능한 모든 명령어 목록과 설명을 확인 → [D]',fills:[{id:'A',label:'[A] CLAUDE.md 자동 생성',ans:['/init']},{id:'B',label:'[B] 토큰/컨텍스트 용량 확인',ans:['/status','/context']},{id:'C',label:'[C] AI 모델 선택',ans:['/model']},{id:'D',label:'[D] 명령어 목록 확인',ans:['/help']}],explain:'/init, /status(또는/context), /model, /help'},
  {id:'13',section:'작업 폴더 / 학습 지표 / 권한',type:'radio',q:'클로드 코드를 실행할 작업 폴더로 이동하는 방법이 아닌 것을 고르세요.',opts:['탐색기 주소창에 cmd를 입력하여 해당 폴더에서 터미널 실행','터미널을 실행한 뒤 cd 명령어로 원하는 폴더로 이동','클로드 코드가 자동으로 최적 폴더를 선택','원하는 폴더에서 마우스 오른쪽 버튼을 클릭해서 터미널 열기'],ans:2,explain:'클로드 코드는 자동으로 폴더를 선택하지 않는다. 사용자가 직접 작업 폴더를 지정해야 한다.'},
  {id:'14',section:'작업 폴더 / 학습 지표 / 권한',type:'radio',q:'손글씨 인식 프로그램 학습 과정에서 관찰할 수 있는 지표로 옳은 설명을 고르세요.',opts:['accuracy는 낮을수록 성능이 좋다.','loss는 높을수록 성능이 좋다.','accuracy는 높을수록, loss는 낮을수록 성능이 좋다.','두 지표 모두 높을수록 성능이 좋다.'],ans:2,explain:'accuracy(정확도)는 높을수록, loss(손실)는 낮을수록 모델 성능이 좋다.'},
  {id:'15',section:'작업 폴더 / 학습 지표 / 권한',type:'radio',q:'클로드 코드의 권한 설정 옵션이 아닌 것을 고르세요.',opts:['Ask every time (매번 확인)','Yes, for this session only (현재 세션만)','Always allow in this project (프로젝트 내 항상 허용)','Never allow modifications (수정 절대 불가)'],ans:3,explain:'Never allow modifications는 실제 Claude Code의 권한 옵션이 아니다.'},
  {id:'16',section:'CLAUDE.md / 명령어 / 압축 / 메모리',type:'radio',q:'CLAUDE.md 파일의 주요 역할이 아닌 것을 고르세요.',opts:['프로젝트 맥락을 자동으로 복원','코딩 규칙과 명령어 저장','이전 대화 내용 전체 저장','클로드 코드가 시작할 때 자동으로 읽어들임'],ans:2,explain:'CLAUDE.md는 프로젝트 맥락과 규칙을 저장하지만, 이전 대화 내용 전체를 저장하지는 않는다.'},
  {id:'17',section:'CLAUDE.md / 명령어 / 압축 / 메모리',type:'radio',q:'CLAUDE.md 파일을 자동으로 생성하는 명령어를 고르세요.',opts:['/start','/init','/create','/setup'],ans:1,explain:'/init 명령어를 실행하면 프로젝트 구조를 분석하여 CLAUDE.md를 자동 생성한다.'},
  {id:'18',section:'CLAUDE.md / 명령어 / 압축 / 메모리',type:'radio',q:'# 의 실제 동작 방식으로 올바른 것을 고르세요.',opts:['입력한 내용을 즉시 CLAUDE.md에 자동 저장','저장 위치를 선택하는 프롬프트를 표시한 후 저장','현재 세션에만 임시로 규칙 적용','모든 프로젝트의 CLAUDE.md를 동시에 업데이트'],ans:1,explain:'# 기호는 저장 위치를 선택하는 프롬프트를 표시한 후 저장한다.'},
  {id:'19',section:'CLAUDE.md / 명령어 / 압축 / 메모리',type:'radio',q:'계층적 CLAUDE.md 구조의 장점으로 옳지 않은 것을 고르세요.',opts:['공통 규칙을 루트에 한 번만 작성','하위 프로젝트별 특화 규칙 적용 가능','토큰 사용량이 자동으로 감소','전체 프로젝트의 일관성 유지'],ans:2,explain:'계층적 구조가 편의성을 주지만, 토큰 사용량이 자동으로 감소하는 것은 보장되지 않는다.'},
  {id:'20',section:'CLAUDE.md / 명령어 / 압축 / 메모리',type:'fill',q:'다음 각 설명에 해당하는 답을 채워 보세요.\n① 프로젝트 폴더 구조를 분석하여 자동으로 생성되는, 프로젝트 컨텍스트와 규칙을 담은 마크다운 파일 → [A]\n② 제품의 목적, 대상 사용자, 주요 기능, 기술 스펙 등을 체계적으로 정리한 제품 요구사항 문서 → [B]\n③ 할 일 관리 앱에서 데이터를 파일로 저장하고 다시 불러올 때 사용하는 데이터 형식 → [C]',fills:[{id:'A',label:'[A] 마크다운 파일 이름',ans:['CLAUDE.md','claude.md']},{id:'B',label:'[B] 제품 요구사항 문서 약자',ans:['PRD']},{id:'C',label:'[C] 데이터 형식',ans:['JSON','json','CSV','csv']}],explain:'CLAUDE.md, PRD(Product Requirements Document), JSON(또는 CSV)'},
  {id:'21',section:'명령어 / 컨텍스트 관리',type:'fill',q:'다음 상황에 맞는 명령어를 채워 보세요.\n• 여러 대화 중 특정 대화를 선택해서 재개하고 싶을 때 → [A]\n• 가장 최근 대화를 즉시 이어서 작업하고 싶을 때 → [B]\n• 현재 컨텍스트 사용량을 시각적으로 확인하고 싶을 때 → [C]\n• 대화가 길어져서 압축이 필요할 때 → [D]\n• 파일 수정 승인을 매번 누르기 번거로울 때 → [E]',fills:[{id:'A',label:'[A] 특정 대화 선택 재개',ans:['--resume','claude --resume']},{id:'B',label:'[B] 최근 대화 즉시 이어받기',ans:['--continue','claude --continue','-c']},{id:'C',label:'[C] 컨텍스트 사용량 시각 확인',ans:['/status','/context']},{id:'D',label:'[D] 대화 압축',ans:['/compact']},{id:'E',label:'[E] 자동 승인 모드',ans:['--dangerously-skip-permissions','shift+tab','Shift+Tab','accept all']}],explain:'--resume, --continue(또는 -c), /status, /compact, --dangerously-skip-permissions(또는 Shift+Tab)'},
  {id:'22',section:'명령어 / 컨텍스트 관리',type:'fill',q:'다음 상황에 맞는 명령어나 대응 방법을 채워 보세요.\n• 퀴즈 게임의 검증 가이드라인을 저장하고 싶을 때 → [A]\n• 이전 대화가 새 작업에 영향을 줄 것 같을 때 → [B]\n• 대화가 길어져서 토큰을 절약하고 싶을 때 → [C]\n• "세계에서 가장 긴 강" 같은 애매한 문제를 발견했을 때 → [D]',fills:[{id:'A',label:'[A] 가이드라인 저장',ans:['#','# 명령어']},{id:'B',label:'[B] 이전 대화 초기화',ans:['/clear','새 대화','/new']},{id:'C',label:'[C] 토큰 절약',ans:['/compact','auto-compact']},{id:'D',label:'[D] 애매한 문제 처리',ans:['할루시네이션','hallucination','AI 할루시네이션','검수']}],explain:'# 으로 CLAUDE.md 저장, /clear로 대화 초기화, /compact로 압축, 애매한 문제는 AI 할루시네이션 확인'},
  {id:'23',section:'명령어 / 컨텍스트 관리',type:'fill',q:'다음 상황에 맞는 명령어나 기능을 채워 보세요.\n• web_version 폴더 구조를 확인하고 싶을 때 → [A]\n• script.js 파일에서 특정 함수를 찾고 싶을 때 → [B]\n• 클로드 코드 설치 상태를 점검하고 싶을 때 → [C]\n• 작업한 대화 내용을 파일로 저장하고 싶을 때 → [D]\n• 다크 모드로 변경하고 싶을 때 → [E]\n• 자동 압축 기능을 끄고 싶을 때 → [F]',fills:[{id:'A',label:'[A] 폴더 구조 확인',ans:['ls','tree','dir']},{id:'B',label:'[B] 파일 내 함수 검색',ans:['@파일명','@script.js','@','grep']},{id:'C',label:'[C] 설치 상태 점검',ans:['/doctor']},{id:'D',label:'[D] 대화 내용 파일 저장',ans:['/export']},{id:'E',label:'[E] 다크 모드 변경',ans:['/config','설정']},{id:'F',label:'[F] 자동 압축 끄기',ans:['/config','auto-compact 끄기']}],explain:'ls(또는 tree), @파일명, /doctor, /export, /config, /config에서 auto-compact 끄기'},
  {id:'24',section:'종합 / 압축 명령어',type:'radio',q:'다음 설명 중 틀린 것을 고르세요.',opts:['/compact는 대화 내용을 요약하여 토큰을 절약한다.','auto-compact는 컨텍스트가 임계값에 도달하면 자동으로 실행된다.','압축 후에도 CLAUDE.md와 프로젝트 파일은 유지된다.','/clear는 대화를 요약하여 압축하고 컨텍스트를 유지한다.'],ans:3,explain:'/clear는 대화를 완전히 초기화한다. 요약·압축하여 컨텍스트를 유지하는 것은 /compact이다.'},
  {id:'25',section:'종합 / 설정 명령어',type:'radio',q:'다음 설명 중 틀린 것을 고르세요.',opts:['스크린 캡처한 이미지는 드래그앤드롭으로 전달할 수 있다.','@ 기호를 사용하면 파일 검색 시간 없이 즉시 프롬프트에 포함된다.','/config는 클로드 코드의 전역 설정만 변경할 수 있다.','/doctor는 자동 업데이트 설정 상태를 확인할 수 있다.'],ans:2,explain:'/config는 전역 설정 외에도 프로젝트별 설정도 변경할 수 있다.'},
  {id:'26',section:'커스텀 명령어',type:'radio',q:'다음 설명 중 틀린 것을 고르세요. (커스텀 명령어)',opts:['프로젝트 명령어는 해당 프로젝트에서만 사용 가능하다.','커스텀 명령어는 자연어로 작성할 수 있다.','명령어 생성 후 즉시 사용 가능하다.','마크다운 파일 형식으로 명령어를 저장한다.'],ans:2,explain:'커스텀 명령어 생성 후에는 클로드 코드를 재시작해야 사용 가능하다.'},
  {id:'27',section:'커스텀 명령어',type:'fill',q:'커스텀 명령어 관련 빈칸을 채워 보세요.\n• 프로젝트 전용 커스텀 명령어 저장 위치 → [A]\n• 전역(모든 프로젝트) 커스텀 명령어 저장 위치 → [B]\n• 새 명령어 작성 후 적용하려면 Claude Code를 [C] 해야 한다.\n• 사용자 입력값을 받으려면 [D] 같은 플레이스홀더를 사용한다.',fills:[{id:'A',label:'[A] 프로젝트 전용 저장 위치',ans:['.claude/commands','.claude/commands/']},{id:'B',label:'[B] 전역 저장 위치',ans:['~/.claude/commands','~/.claude/commands/']},{id:'C',label:'[C] 적용 방법',ans:['재시작','restart','reload','다시 시작']},{id:'D',label:'[D] 입력 플레이스홀더',ans:['{input}','$ARGUMENTS']}],explain:'.claude/commands (프로젝트), ~/.claude/commands (전역), 재시작, {input}'},
  {id:'28',section:'에이전트',type:'radio',q:'커스텀 명령어와 에이전트의 기술적 차이점으로 옳은 것을 고르세요.',opts:['커스텀 명령어는 .md 파일로 저장되지만 에이전트는 .json 파일로 저장된다.','에이전트는 독립적인 AI 모델을 선택할 수 있지만 커스텀 명령어는 메인 세션의 모델을 공유한다.','커스텀 명령어가 에이전트보다 더 복잡한 작업 플로우를 처리할 수 있다.','에이전트는 적용을 위해 재시작이 필요하지만 커스텀 명령어는 바로 사용할 수 있다.'],ans:1,explain:'에이전트는 독립적인 컨텍스트와 모델 선택이 가능하며, 커스텀 명령어는 메인 세션 모델을 공유한다.'},
  {id:'29',section:'에이전트',type:'radio',q:"에이전트 생성 시 '4. Inherit from parent' 옵션을 선택했을 때의 동작으로 옳은 것을 고르세요.",opts:['항상 가장 저렴한 모델을 자동 선택한다.','메인 세션에서 사용 중인 모델을 그대로 상속받는다.','부모 에이전트가 사용하는 모델을 복사한다.','Claude의 최신 모델로 자동 업그레이드된다.'],ans:1,explain:'Inherit from parent는 메인(부모) 세션의 모델 설정을 그대로 상속받는다.'},
  {id:'30',section:'에이전트',type:'multi',q:'에이전트에게 Read-only 권한만 부여했을 때 수행할 수 없는 작업을 모두 고르세요. (복수 선택)',opts:['코드 파일 내용 읽기 및 분석','버그 리포트 생성','발견한 버그 수정','새로운 테스트 파일 생성'],ans:[2,3],explain:'Read-only 권한에서는 파일 읽기와 분석, 보고서 생성은 가능하지만 파일 수정이나 생성은 불가하다.'},
  {id:'31',section:'에이전트',type:'radio',q:'AI 공감 다이어리 개발에서 QA 테스트 시간이 더 오래 걸린 이유로 가장 적절한 것을 고르세요.',opts:['QA 에이전트가 더 느린 AI 모델을 사용하기 때문이다.','QA 에이전트는 이전 에이전트들의 작업 결과를 모두 검토해야 하기 때문이다.','QA 에이전트만 인터넷 연결이 필요하기 때문이다.','QA 에이전트는 파일 읽기 권한이 없기 때문이다.'],ans:1,explain:'QA 에이전트는 이전 에이전트들이 생성한 모든 결과물을 검토해야 하므로 시간이 더 걸린다.'},
  {id:'32',section:'에이전트',type:'radio',q:'PDF 요약 도구에서 에이전트들이 PRD를 참조하는 방식으로 옳지 않은 것을 고르세요.',opts:['PRD가 프로젝트 폴더에 생성되어 각 에이전트들이 접근한다.','에이전트들이 순차적, 혹은 병렬로 작업하며 PRD를 참조하게 된다.','PRD 파일 경로를 에이전트별로 지정하지 않아도 된다.','PRD는 .claude/agents/ 폴더에 자동으로 복사되어 공유된다.'],ans:3,explain:'PRD가 .claude/agents/ 폴더에 자동 복사되는 기능은 없다.'},
  {id:'33',section:'MCP',type:'radio',q:'MCP와 API의 차이점으로 가장 적절한 설명을 고르세요.',opts:['API는 특정 기능을 요청하는 방식이고, MCP는 AI가 외부 시스템과 직접 소통하게 하는 프로토콜이다.','MCP는 API보다 속도가 빠르다.','API는 유료이고 MCP는 무료이다.','MCP는 클로드 코드에서만 사용 가능하다.'],ans:0,explain:'MCP(Model Context Protocol)는 AI가 외부 시스템과 직접 소통하게 하는 프로토콜이며, API는 특정 기능을 요청하는 인터페이스이다.'},
  {id:'34',section:'MCP',type:'radio',q:"로컬 MCP 서버 설치 명령어에서 '--' 구분자의 역할로 옳은 것을 고르세요.",opts:['주석을 표시하는 기호','클로드 코드 옵션과 MCP 서버 실행 명령을 구분','버전 정보를 나타내는 표시','에러 처리를 위한 구분자'],ans:1,explain:'-- 구분자는 클로드 코드 자체의 옵션과 MCP 서버 실행 명령어를 구분하는 역할을 한다.'},
  {id:'35',section:'MCP',type:'radio',q:'Playwright MCP가 테스트 완료 후 생성하는 폴더 이름을 고르세요.',opts:['.test-results','.playwright-mcp','.automation','.screenshots'],ans:0,explain:'Playwright MCP는 테스트 결과를 .test-results 폴더에 저장한다.'},
  {id:'36',section:'API 키 / 오픈라우터',type:'multi',q:'오픈라우터에서 API를 사용하기 위해 필요한 것을 모두 고르세요. (복수 선택)',opts:['API 키','모델명','자체 서버','.gitignore 파일'],ans:[0,1],explain:'오픈라우터 API 사용에는 API 키와 모델명이 필요하다. 자체 서버나 .gitignore는 필수가 아니다.'},
  {id:'37',section:'API 키 / 오픈라우터',type:'radio',q:'클로드 코드에서 API 키를 안전하게 관리하기 위한 방법이 아닌 것을 고르세요.',opts:['.env 파일에 API 키 저장','.gitignore 파일에 .env 추가','코드에 직접 API 키 하드코딩','프로젝트 폴더 내에서만 키 참조'],ans:2,explain:'API 키를 코드에 직접 하드코딩하면 깃허브 등에 노출될 위험이 있으므로 절대 하지 않아야 한다.'},
  {id:'38',section:'API 키 / 오픈라우터',type:'radio',q:'오픈라우터의 Activity 메뉴에서 확인할 수 없는 정보는?',opts:['사용한 모델명','사용 시간','호출한 코드 내용','API 호출 기록'],ans:2,explain:'Activity 메뉴에서는 모델명, 사용 시간, 호출 기록 등을 볼 수 있으나 코드 내용 자체는 보이지 않는다.'},
  {id:'39',section:'API 키 / 오픈라우터',type:'multi',q:'PRD를 3단계로 분리하여 개발할 때, 2단계에서 텍스트 모델 API 호출이 실패하면 점검이 필요한 항목을 모두 고르세요. (복수 선택)',opts:['.env 파일의 OPENROUTER_API_KEY 존재 여부','텍스트 모델명의 정확성','1단계에서 Streamlit 서버가 이미 8501 포트를 사용 중인지 여부','.gitignore 파일의 존재 여부'],ans:[0,1,2],explain:'API 키 존재 여부, 모델명 정확성, 포트 충돌 여부를 점검해야 한다. .gitignore는 보안 관련이지 API 실패와 직접 무관하다.'},
  {id:'40',section:'배포 / Streamlit / GitHub',type:'radio',q:'Streamlit과 전통적인 웹 개발(HTML/CSS/JS)의 차이점으로 틀린 것을 고르세요.',opts:['Streamlit은 파이썬 코드만으로 웹 앱을 만들 수 있다.','Streamlit은 데이터 시각화와 ML 모델 시연에 특화되어 있다.','Streamlit은 반드시 프런트엔드와 백엔드를 분리해야 한다.','Streamlit은 streamlit run 명령어로 실행 가능하다.'],ans:2,explain:'Streamlit은 프런트엔드와 백엔드를 분리할 필요 없이 파이썬 코드 하나로 처리한다.'},
  {id:'41',section:'배포 / Streamlit / GitHub',type:'radio',q:'깃허브에 코드를 업로드하는 순서로 올바른 것을 고르세요.',opts:['commit → add → push','push → add → commit','add → commit → push','add → push → commit'],ans:2,explain:'Git 업로드 순서: git add (스테이징) → git commit (로컬 저장) → git push (원격 업로드)'},
  {id:'42',section:'배포 / Streamlit / GitHub',type:'radio',q:'로컬 스토리지와 클라우드 데이터베이스의 가장 큰 차이점은?',opts:['로컬 스토리지가 더 빠르다.','데이터베이스는 여러 기기에서 데이터를 공유할 수 있다.','로컬 스토리지가 더 안전하다.','데이터베이스는 무료가 없다.'],ans:1,explain:'클라우드 데이터베이스의 핵심 장점은 여러 기기/사용자 간 데이터 공유가 가능하다는 점이다.'},
  {id:'43',section:'배포 / Streamlit / GitHub',type:'radio',q:'Vercel 배포 시 404 에러가 발생한 이유와 해결 방법으로 옳은 것을 고르세요.',opts:['서버 오류 – 재시작 필요','index.html 파일 부재 – 파일명 변경 필요','인증 실패 – 재로그인 필요','네트워크 오류 – 연결 확인 필요'],ans:1,explain:'Vercel에서 404 에러는 보통 index.html이 없거나 파일명이 다를 때 발생한다.'},
];

function shuffle(arr){return arr.slice().sort(()=>Math.random()-0.5);}

let questions = shuffle(ALL_QUESTIONS);
let current = 0;
let userAnswers = {};
let submitted = {};
let score = 0;
let quizDone = false;

function render(){
  const root = document.getElementById('root');
  if(quizDone){renderScore(root);return;}
  if(current>=questions.length){finishQuiz();return;}
  const q = questions[current];
  const answered = submitted[q.id];
  let html = `
  <div class="header">
    <div class="title">🤖 클로드 코드 퀴즈</div>
    <div class="progress">${current+1} / ${questions.length}문제</div>
  </div>
  <div class="nav-dots">${questions.map((qq,i)=>{
    let cls='dot';
    if(i===current)cls+=' current';
    else if(submitted[qq.id]!==undefined){
      if(submitted[qq.id].correct)cls+=' answered'; else cls+=' wrong-dot';
    }
    return `<div class="${cls}" title="${i+1}번" onclick="goTo(${i})"></div>`;
  }).join('')}</div>
  <div class="qcard">
    <div class="qtag">${q.section}</div>
    <div class="qtext">${q.q.replace(/\n/g,'<br>')}</div>`;

  if(q.type==='radio'){
    const sel = userAnswers[q.id];
    html += `<div class="options">`;
    q.opts.forEach((o,i)=>{
      let cls='opt';
      if(answered!==undefined){
        if(i===q.ans)cls+=' correct';
        else if(sel===i&&i!==q.ans)cls+=' wrong';
      } else if(sel===i) cls+=' selected';
      html+=`<div class="${cls}" onclick="selectOpt('${q.id}',${i},'radio')">
        <span class="opt-label">${['①','②','③','④','⑤'][i]}</span>
        <span>${o}</span></div>`;
    });
    html+=`</div>`;
  } else if(q.type==='multi'){
    const sel = userAnswers[q.id]||[];
    html += `<div class="multi-hint">※ 해당하는 것을 모두 선택하세요.</div><div class="options">`;
    q.opts.forEach((o,i)=>{
      let cls='multi-opt';
      const isSelected = sel.includes(i);
      if(answered!==undefined){
        if(q.ans.includes(i))cls+=' correct';
        else if(isSelected&&!q.ans.includes(i))cls+=' wrong';
      } else if(isSelected) cls+=' selected';
      html+=`<div class="${cls}" onclick="selectOpt('${q.id}',${i},'multi')">
        <span class="opt-label">${isSelected?'☑':'☐'}</span>
        <span>${o}</span></div>`;
    });
    html+=`</div>`;
  } else if(q.type==='fill'){
    html += `<div class="fill-wrap">`;
    q.fills.forEach(f=>{
      const val = (userAnswers[q.id]||{})[f.id]||'';
      let inputCls = 'fill-input';
      if(answered!==undefined){
        const correct = f.ans.some(a=>val.trim().toLowerCase()===a.toLowerCase()||val.trim()===a);
        inputCls += correct?' correct':' wrong';
        html+=`<div>
          <div class="fill-label">${f.label}</div>
          <input class="${inputCls}" type="text" value="${val}" readonly>
          ${!correct?`<div style="font-size:12px;color:#15803d;margin-top:3px;">정답: ${f.ans[0]}</div>`:''}
        </div>`;
      } else {
        html+=`<div>
          <div class="fill-label">${f.label}</div>
          <input class="${inputCls}" type="text" value="${val}" 
            oninput="fillInput('${q.id}','${f.id}',this.value)" placeholder="답을 입력하세요">
        </div>`;
      }
    });
    html += `</div>`;
  }

  html += `<div class="btns">`;
  if(answered===undefined){
    html += `<button class="btn-submit" onclick="submitQ('${q.id}')">제출하기</button>`;
    if(current>0) html += `<button class="btn-secondary" onclick="prevQ()">← 이전</button>`;
  } else {
    html += `<div class="feedback ${answered.correct?'correct':answered.partial?'partial':'wrong'}">
      <strong>${answered.correct?'✓ 정답입니다!':answered.partial?'△ 부분 정답입니다.':'✗ 틀렸습니다.'}</strong><br>
      <span style="margin-top:4px;display:inline-block">${q.explain}</span>
    </div>`;
    html += `<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">`;
    if(current>0) html += `<button class="btn-secondary" onclick="prevQ()">← 이전</button>`;
    if(current<questions.length-1){
      html += `<button class="btn-next" onclick="nextQ()">다음 문제 →</button>`;
    } else {
      html += `<button class="btn-submit" onclick="finishQuiz()">결과 보기 🏁</button>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;
  root.innerHTML = html;
}

function goTo(i){current=i;render();}
function prevQ(){if(current>0){current--;render();}}
function nextQ(){current++;render();}

function selectOpt(id,i,type){
  if(submitted[id]!==undefined)return;
  if(type==='radio'){userAnswers[id]=i;}
  else{
    const a=userAnswers[id]||[];
    const idx=a.indexOf(i);
    if(idx>-1)a.splice(idx,1);else a.push(i);
    userAnswers[id]=[...a];
  }
  render();
}
function fillInput(id,fid,val){
  if(!userAnswers[id])userAnswers[id]={};
  userAnswers[id][fid]=val;
}
function submitQ(id){
  const q = questions.find(qq=>qq.id===id);
  let correct=false,partial=false;
  if(q.type==='radio'){
    correct = userAnswers[id]===q.ans;
  } else if(q.type==='multi'){
    const sel=(userAnswers[id]||[]).slice().sort((a,b)=>a-b);
    const exp=q.ans.slice().sort((a,b)=>a-b);
    correct=JSON.stringify(sel)===JSON.stringify(exp);
    if(!correct&&sel.some(v=>q.ans.includes(v)))partial=true;
  } else if(q.type==='fill'){
    const ua=userAnswers[id]||{};
    const results=q.fills.map(f=>{
      const v=(ua[f.id]||'').trim();
      return f.ans.some(a=>v.toLowerCase()===a.toLowerCase()||v===a);
    });
    correct=results.every(Boolean);
    if(!correct&&results.some(Boolean))partial=true;
  }
  if(correct)score++;
  submitted[id]={correct,partial};
  render();
}
function finishQuiz(){
  quizDone=true;
  const root=document.getElementById('root');
  renderScore(root);
}
function renderScore(root){
  const total=questions.length;
  const pct=Math.round((score/total)*100);
  let grade='';
  if(pct>=90)grade='🏆 우수';
  else if(pct>=70)grade='👍 양호';
  else if(pct>=50)grade='📚 보통';
  else grade='💪 분발';
  root.innerHTML=`
  <div class="header"><div class="title">🤖 클로드 코드 퀴즈</div></div>
  <div class="score-box">
    <div class="score-num">${score} / ${total}</div>
    <div class="score-sub">정답률 ${pct}%</div>
    <div class="score-grade">${grade}</div>
    <div style="margin-top:1.5rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn-submit" onclick="restartQuiz()">🔀 다시 풀기 (셔플)</button>
      <button class="btn-secondary" onclick="reviewWrong()">✗ 틀린 문제만</button>
    </div>
  </div>
  <div class="review-list">
    <div style="font-size:13px;font-weight:600;color:#555;margin:1rem 0 6px;">문제별 결과 (클릭하면 해당 문제로 이동)</div>
    ${questions.map((q,i)=>{
      const s=submitted[q.id];
      const ok=s&&s.correct;
      const pt=s&&s.partial;
      return `<div class="review-item" onclick="reviewQ(${i})">
        <span class="review-icon">${ok?'✓':pt?'△':'✗'}</span>
        <span class="review-section">${q.section.split('/')[0].trim()}</span>
        <span class="review-q">${q.q.split('\n')[0].slice(0,45)}${q.q.split('\n')[0].length>45?'…':''}</span>
      </div>`;
    }).join('')}
  </div>`;
}
function restartQuiz(){
  questions=shuffle(ALL_QUESTIONS);
  userAnswers={};submitted={};score=0;current=0;quizDone=false;render();
}
function reviewWrong(){
  const wrong=questions.filter(q=>submitted[q.id]&&!submitted[q.id].correct);
  if(!wrong.length){alert('틀린 문제가 없습니다! 완벽해요!');return;}
  questions=shuffle(wrong);
  userAnswers={};submitted={};score=0;current=0;quizDone=false;render();
}
function reviewQ(i){quizDone=false;current=i;render();}

render();
</script>
</body>
</html>
